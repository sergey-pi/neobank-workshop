version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neobank-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-neouser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-neopassword}
      - POSTGRES_DB=neobank_user_db
      - POSTGRES_MULTIPLE_DATABASES=neobank_ledger_db,neobank_payment_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh

  redis:
    image: redis:7-alpine
    container_name: neobank-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
