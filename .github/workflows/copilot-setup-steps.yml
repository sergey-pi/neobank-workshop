name: "Copilot Setup Steps"

# Runs automatically when this file changes (for validation), and can be
# triggered manually from the Actions tab to verify the setup works.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Job name MUST be `copilot-setup-steps` — Copilot looks for this exact name.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59

    permissions:
      contents: read  # needed for checkout

    # PostgreSQL is required for Flyway migrations and jOOQ source generation.
    # Copilot needs the DB live so it can apply schema changes and regenerate
    # generated sources after modifying migration files.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neouser
          POSTGRES_PASSWORD: neopassword
          POSTGRES_DB: neobank_user_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21 (Temurin) with Maven cache
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Create ledger and payment databases
        run: |
          PGPASSWORD=neopassword psql -h localhost -U neouser -d postgres \
            -c "CREATE DATABASE neobank_ledger_db;" \
            -c "CREATE DATABASE neobank_payment_db;"

      # Install common module into local Maven repo first.
      # The -am flag also installs the parent POM, which is required for
      # any subsequent per-module build to resolve the parent descriptor.
      - name: Install common module
        run: ./mvnw install -pl common -am -DskipTests --no-transfer-progress

      # Apply schema migrations so the DB is in the expected state for
      # jOOQ code generation in the compile step below.
      - name: Apply Flyway migrations (all services)
        run: |
          ./mvnw flyway:migrate -pl user-service --no-transfer-progress
          ./mvnw flyway:migrate -pl ledger-service --no-transfer-progress
          ./mvnw flyway:migrate -pl payment-service --no-transfer-progress

      # Full compile (including jOOQ source generation) warms the Maven
      # dependency cache and gives Copilot ready-to-use generated sources.
      # Tests are skipped here — Copilot will run them when verifying changes.
      - name: Build all modules (skip tests)
        run: ./mvnw install -DskipTests --no-transfer-progress
