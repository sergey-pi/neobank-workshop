spring:
  application:
    name: user-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/neobank_user_db
    username: ${DB_USER:neouser}
    password: ${DB_PASSWORD:neopassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 60000
      pool-name: ${spring.application.name:service}-pool
      leak-detection-threshold: 60000
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/neobank_user_db
    user: ${DB_USER:neouser}
    password: ${DB_PASSWORD:neopassword}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1000

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  config: classpath:logback-spring.xml

neobank:
  error:
    base-url: ${ERROR_BASE_URL:https://neobank.com/errors}

security:
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:10}
    # Comma-separated CIDR list of trusted reverse proxies allowed to set X-Forwarded-For.
    # Empty (default) means X-Forwarded-For is never trusted (prevents IP spoofing bypasses).
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
  internal-service-key: ${INTERNAL_SERVICE_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production-min-256-bits}
  expiration-hours: ${JWT_EXPIRATION_HOURS:1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: NeoBank User Service API
    description: Identity, registration, and KYC management
    version: 1.0.0
