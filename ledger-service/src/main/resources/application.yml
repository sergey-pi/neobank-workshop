spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/neobank_ledger_db
    username: ${DB_USER:neouser}
    password: ${DB_PASSWORD:neopassword}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/neobank_ledger_db
    user: ${DB_USER:neouser}
    password: ${DB_PASSWORD:neopassword}

server:
  port: 8082

logging:
  config: classpath:logback-spring.xml
