spring:
  application:
    name: ledger-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/neobank_ledger_db
    username: ${DB_USER:neouser}
    password: ${DB_PASSWORD:neopassword}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/neobank_ledger_db
    user: ${DB_USER:neouser}
    password: ${DB_PASSWORD:neopassword}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1000

server:
  port: 8082
  shutdown: graceful

logging:
  config: classpath:logback-spring.xml

neobank:
  error:
    base-url: ${ERROR_BASE_URL:https://neobank.com/errors}

services:
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8081}
  internal-service-key: ${INTERNAL_SERVICE_KEY:}

security:
  limits:
    max-transfer-amount: ${MAX_TRANSFER_AMOUNT:1000000}
    daily-spend-limit: ${DAILY_SPEND_LIMIT:5000000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: NeoBank Ledger Service API
    description: Double-entry accounting and balance management
    version: 1.0.0
