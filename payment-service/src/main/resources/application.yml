spring:
  application:
    name: payment-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/neobank_payment_db
    username: ${DB_USER:neouser}
    password: ${DB_PASSWORD:neopassword}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/neobank_payment_db
    user: ${DB_USER:neouser}
    password: ${DB_PASSWORD:neopassword}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1000

server:
  port: 8083
  shutdown: graceful

logging:
  config: classpath:logback-spring.xml

neobank:
  error:
    base-url: ${ERROR_BASE_URL:https://neobank.com/errors}

outbox:
  poll:
    interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
    max-retries: ${OUTBOX_MAX_RETRIES:3}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production-min-256-bits}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: NeoBank Payment Service API
    description: Payment orders, routing, and idempotency
    version: 1.0.0
